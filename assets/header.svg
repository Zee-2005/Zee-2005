<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MOHAMMED ZEESHAN</title>
  <desc id="desc">Username text with a pixel flicker, break, and repair glitch effect.</desc>

  <defs>
