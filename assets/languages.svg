<svg viewBox="0 0 500 170" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: monospace; }
  </style>

  <!-- Java 42% -->
  <text x="0" y="14" font-size="13" fill="#ff3b3b">Java</text>
  <text x="470" y="14" font-size="13" fill="#ff3b3b" text-anchor="end">42%</text>
  <rect x="0" y="22" width="470" height="10" rx="3" fill="#ff3b3b" transform="scale(0,1)">
    <animateTransform attributeName="transform" type="scale" from="0 1" to="0.42 1"
      dur="1.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- TypeScript 25% -->
  <text x="0" y="52" font-size="13" fill="#e03434">TypeScript</text>
  <text x="470" y="52" font-size="13" fill="#e03434" text-anchor="end">25%</text>
  <rect x="0" y="60" width="470" height="10" rx="3" fill="#e03434" transform="scale(0,1)">
    <animateTransform attributeName="transform" type="scale" from="0 1" to="0.25 1"
      dur="1.4s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- Python 18% -->
  <text x="0" y="90" font-size="13" fill="#b51212">Python</text>
  <text x="470" y="90" font-size="13" fill="#b51212" text-anchor="end">18%</text>
  <rect x="0" y="98" width="470" height="10" rx="3" fill="#b51212" transform="scale(0,1)">
    <animateTransform attributeName="transform" type="scale" from="0 1" to="0.18 1"
      dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- JavaScript 10% -->
  <text x="0" y="128" font-size="13" fill="#8a1414">JavaScript</text>
  <text x="470" y="128" font-size="13" fill="#8a1414" text-anchor="end">10%</text>
  <rect x="0" y="136" width="470" height="10" rx="3" fill="#8a1414" transform="scale(0,1)">
    <animateTransform attributeName="transform" type="scale" from="0 1" to="0.10 1"
      dur="1.4s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- SQL 5% -->
  <text x="0" y="156" font-size="13" fill="#5c0a0a">SQL</text>
  <text x="470" y="156" font-size="13" fill="#5c0a0a" text-anchor="end">5%</text>
  <rect x="0" y="164" width="470" height="6" rx="3" fill="#5c0a0a" transform="scale(0,1)">
    <animateTransform attributeName="transform" type="scale" from="0 1" to="0.05 1"
      dur="1.4s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
</svg>
